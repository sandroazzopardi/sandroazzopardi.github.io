<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandro Azzopardi | Malta</title>
  <link rel="icon" type="image/svg+xml" href="/SA.svg">
  <meta name="description" content="Sandro Azzopardi — Malta. Mechanical industrialization manufacturing engineering, with an emphasis on innovation, automation and continuous improvement.">
  <meta name="author" content="Sandro Azzopardi">

  <meta property="og:type" content="website">

  <meta property="og:description" content="Sandro Azzopardi — Malta. Sandro Azzopardi — Malta. Mechanical industrialization manufacturing engineering, with an emphasis on innovation, automation and continuous improvement.">

  <meta property="og:site_name" content="Sandro Azzopardi">

  <style>
    :root {
      --bg: #ffffff;
      --text: #18202a;
      --muted: #66717e;
      --line: #e2e6eb;
      --accent: #1d5fbf;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .container {
      width: min(100%, 760px);
      text-align: center;
    }
    h1 {
      margin: 0 0 80px;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 1;
      letter-spacing: -.06em;
      font-weight: 750;
    }
    h2 {
      margin: 0 0 24px;
      font-size: 1.5rem;
      letter-spacing: -.02em;
    }
    .links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .link {
      display: inline-block;
      min-width: 110px;
      padding: 11px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .link:hover {
      border-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }
    footer {
      padding: 25px 20px;
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sandro Azzopardi",
    "url": "https://sandroazzopardi.com/",
    "sameAs": [
      "YOUR_LINKEDIN_URL",
      "YOUR_INSTAGRAM_URL",
      "YOUR_FACEBOOK_URL"
    ]
  }
  </script>
</head>

<body>
  <main>
    <div class="container">
      <h1>Sandro Azzopardi</h1>

      <section id="connect">
        <h2>Connect</h2>
        <div class="links">
          <a class="link" href="https://www.linkedin.com/in/sandroazzopardi" rel="me noopener" target="_blank">LinkedIn</a>
          <a class="link" href="https://www.instagram.com/sandro.azzopardi" rel="me noopener" target="_blank">Instagram</a>
          <a class="link" href="https://www.facebook.com/sandroazzopardi" rel="me noopener" target="_blank">Facebook</a>
        </div>
      </section>
    </div>
  </main>

  <footer>© <span id="year"></span> Sandro Azzopardi</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
